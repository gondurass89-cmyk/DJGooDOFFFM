# =====================================================
# WRANGLER.TOML - Конфигурация Cloudflare Workers
# =====================================================
#
# ВАЖНО: Каждый worker требует отдельный wrangler.toml
# Файлы находятся в соответствующих подпапках:
#
# workers/radio-stream/   → radio-stream worker
# workers/nowplaying/     → nowplaying worker
# workers/listeners/      → listeners worker
#
# ИНСТРУКЦИЯ ПО ДЕПЛОЮ ЧЕРЕЗ CLI:
# 1. npm install -g wrangler
# 2. wrangler login
# 3. cd workers/<worker-name> && wrangler deploy
#
# ИЛИ ИСПОЛЬЗОВАТЬ КОД В CLOUDFLARE DASHBOARD:
# Cloudflare Dashboard → Workers & Pages → Create Worker
# Скопировать код из workers/*.js и вставить в редактор
#
# =====================================================
# НАСТРОЙКИ D1 DATABASE (для nowplaying и listeners)
# =====================================================
# После создания D1 Database, привяжите к worker:
# wrangler d1 create nowplaying-db
# wrangler d1 create listeners-db
#
# Затем добавьте в wrangler.toml worker'а:
# [[d1_databases]]
# binding = "DB"
# database_name = "nowplaying-db"
# database_id = "xxx-xxx-xxx"
# =====================================================

# Основной worker для проксирования аудио потока
name = "radio-stream"
main = "workers/radio-stream-worker.js"
compatibility_date = "2024-01-01"

# Раскомментируйте и укажите ваш Account ID
# account_id = "your-account-id-here"

[build]
command = ""

[env.production]
logpush = true
