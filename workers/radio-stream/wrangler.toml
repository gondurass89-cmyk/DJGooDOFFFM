# =====================================================
# RADIO-STREAM WORKER - HTTPS прокси для аудио потока
# =====================================================
#
# ДЕПЛОЙ:
#   cd workers/radio-stream && wrangler deploy
#
# НАЗНАЧЕНИЕ:
#   Проксирует HTTP Icecast поток через HTTPS
#   Решает проблему mixed content (HTTP на HTTPS сайте)
#
# UPSTREAM URL (настройте в переменных окружения):
#   wrangler secret put UPSTREAM_URL
#   Значение: http://your-server:8000/Radio
# =====================================================

name = "radio-stream"
main = "../radio-stream-worker.js"
compatibility_date = "2024-01-01"

# Раскомментируйте и укажите ваш Account ID
# account_id = "your-account-id-here"

# Upstream URL можно задать через секрет или переменную
# [vars]
# UPSTREAM_URL = "http://s0.radioheart.ru:8000/RH84200"

[env.production]
logpush = true
