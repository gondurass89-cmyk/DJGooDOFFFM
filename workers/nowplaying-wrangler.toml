# =====================================================
# WRANGLER.TOML - Конфигурация для nowplaying worker
# =====================================================
# 
# ИНСТРУКЦИЯ ПО ДЕПЛОЮ:
# 1. cd /home/z/my-project/djgoodoff-fm
# 2. npx wrangler deploy workers/nowplaying-wrangler.toml
#
# URL: https://nowplaying.gondurass89.workers.dev/
# =====================================================

name = "nowplaying"
main = "workers/nowplaying-worker.js"
compatibility_date = "2024-01-01"

# Account ID нужен для деплоя
# Найдите в Cloudflare Dashboard: https://dash.cloudflare.com/
# account_id = ""

# =====================================================
# НАСТРОЙКИ ДЕПЛОЯ
# =====================================================
[build]
command = ""  # Нет команды сборки - чистый JS

# =====================================================
# НАСТРОЙКИ ПРОИЗВОДИТЕЛЬНОСТИ
# =====================================================
# Логирование в production
[env.production]
logpush = true
